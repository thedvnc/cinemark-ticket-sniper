name: watch
on:
  schedule:
    # Offset from :00/:30 on purpose: GitHub sheds scheduled runs at peak minutes.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fire a test alert instead of sweeping (verifies the email channel)"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Cinemark can return multi-minute rate-limit backoffs; retain state when a
    # throttled sweep needs more than the normal cadence window.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: inputs.test_alert
        run: >-
          ./notify-hook "Test alert"
          "The email channel works. A real alert reads 'Seats open 2026-08-08
          7:00pm, F11-F12'. You can close this issue."

      - name: Run sweep
        if: ${{ !inputs.test_alert }}
        run: python3 watch.py --once

      - name: Persist state
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "odyssey-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"

          # State is required for detecting new openings. Stage it independently
          # so an absent alerts.log does not prevent state.json from being saved.
          git add state.json
          if [ -f alerts.log ]; then
            git add alerts.log
          fi

          if git diff --cached --quiet; then
            echo "No watcher state changes to persist."
            exit 0
          fi

          git commit -m "state: sweep $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
